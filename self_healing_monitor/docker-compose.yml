services:
  # ============================================================================
  # 1. Sample Monitored Web Application (Nginx)
  # ============================================================================
  sample-nginx:
    image: nginx:alpine
    container_name: sample-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    volumes:
      - ./nginx-html:/usr/share/nginx/html:ro
    networks:
      - monitor-net

  # ============================================================================
  # 2. Self-Healing Monitor Daemon
  # ============================================================================
  self-healing-monitor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: self-healing-monitor
    restart: always
    network_mode: "host" # Allows testing localhost:80, ICMP ping, and system metrics directly
    environment:
      - MONITOR_CONFIG_PATH=/app/config/config.yaml
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      - SNS_TOPIC_ARN=${SNS_TOPIC_ARN:-}
      - CLOUDWATCH_LOG_GROUP=${CLOUDWATCH_LOG_GROUP:-/aws/ec2/self-healing-monitor}
      - DRY_RUN=${DRY_RUN:-false}
    volumes:
      # Mount Docker socket so monitor can inspect, restart, and recreate containers
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount compose project directory for Tier 2 compose recreate
      - .:/opt/self-healing-monitor:ro
      # Read-only mount of host system metrics /proc /sys
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    depends_on:
      sample-nginx:
        condition: service_started

networks:
  monitor-net:
    driver: bridge
