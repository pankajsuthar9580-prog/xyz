<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sample Monitored Service</title>
  <style>
    body { font-family: sans-serif; background: #0f172a; color: #f8fafc; padding: 40px; text-align: center; }
    .card { background: #1e293b; border-radius: 8px; padding: 24px; max-width: 600px; margin: auto; border: 1px solid #334155; }
    h1 { color: #38bdf8; margin-top: 0; }
    .status { color: #4ade80; font-weight: bold; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Production Web Workload</h1>
    <p>Status: <span class="status">OPERATIONAL</span></p>
    <p>Monitored by AWS Self-Healing Automated Recovery System.</p>
  </div>
</body>
</html>
